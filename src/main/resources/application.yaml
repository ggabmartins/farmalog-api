server:
  error:
    include-stacktrace: never
    include-message: always

spring:
  application:
    name: farmalog-api
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

rsa:
  public-key: classpath:keys/public_key.pem
  private-key: classpath:keys/private_key.pem

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
