# O modulo spring-boot-docker-compose sobe o compose.yaml e injeta a conexao
# JDBC do container automaticamente. A configuracao equivalente, se voce quisesse
# subir o Postgres a mao (docker compose up -d) e apontar manualmente, seria:
#
# spring:
#   datasource:
#     url: jdbc:postgresql://localhost:5432/farmalog
#     username: farmalog
#     password: <o valor do seu .env>

spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: debug
